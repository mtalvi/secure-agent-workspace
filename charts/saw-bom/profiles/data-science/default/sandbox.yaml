apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
  - name: notebook
    type: openclaw
    enabled: true
    image: quay.io/aipcc/base-images/agentic/openclaw@sha256:896d1526ee29b53167034ba65d1c758c8da777f441ed094e19f3bcf6d7445c61
    providers:
    - nvidia
    harnessRef:
      name: ds-default
    inference:
      providerRef: nvidia
      model:
        secretKeyRef:
          name: inference
          key: model
        default: nvidia/nemotron-3.5-lightning-30b-a3b
        title: Model (notebook)
    ui:
      route: true
    env:
      PR123_TYPED_TEST:
        value: before
  - name: cuda-sandbox
    type: nemoclaw
    enabled: false
    agent: openclaw
    image: ghcr.io/validatedpatterns-sandbox/nemoclaw-sandbox:latest
    providers:
    - nvidia
  - name: toolbox
    type: generic
    enabled: false
    image: base
    providers:
    - nvidia

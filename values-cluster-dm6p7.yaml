# PR166 review site configuration; no owner identities or credentials.
clusterGroup:
  namespaces:
    agent-sandbox-system: null
    openshift-nfd:
      operatorGroup: true
      targetNamespaces:
      - openshift-nfd
    saw-pr166-builds: null
  applications:
    agent-sandbox:
      name: agent-sandbox
      namespace: agent-sandbox-system
      path: charts/agent-sandbox
      overrides:
      - name: enabled
        value: 'true'
    review-node-features:
      name: review-node-features
      namespace: openshift-nfd
      path: overrides/pr166-node-features
      kustomize: true
    governance-interceptor:
      overrides:
      - name: image
        value: image-registry.openshift-image-registry.svc:5000/saw-pr166-builds/governance-interceptor@sha256:0517ea7ede21f48081618c90731208b5c54b26d5361c304f62186f371dfa4e21
    review-kata-platform:
      name: review-kata-platform
      namespace: openshift-sandboxed-containers-operator
      path: overrides/pr166-kata-platform
      kustomize: true
    review-image-cache:
      name: review-image-cache
      namespace: saw-pr166-builds
      path: charts/saw-image-cache
      extraValueFiles:
      - /overrides/pr166-image-cache.yaml
  subscriptions:
    nfd:
      name: nfd
      namespace: openshift-nfd
      channel: stable

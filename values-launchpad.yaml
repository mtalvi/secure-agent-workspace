global:
  webSearch:
    enabled: false
clusterGroup:
  namespaces:
    openshift-cnv:
      disabled: true
    rhdh:
      disabled: true
    rhdh-operator:
      disabled: true
    saw-portal:
      disabled: true
    redhat-ods-operator:
      disabled: true
  subscriptions:
    openshift-virtualization: null
    rhdh: null
    openshift-pipelines: null
    openshift-ai: null
  applications:
    openshift-cnv: null
    openshell-rhdh: null
    saw-users:
      overrides:
      - name: ownerResolution.enabled
        value: 'false'
      - name: global.webSearch.enabled
        value: '{{ .Values.global.webSearch.enabled }}'
        forceString: true
      # The router address is supplied only through private runtime parameters.
      - name: defaults.openshellSaw.networkPolicy.extraEgress[0].ports[0].protocol
        value: TCP
      - name: defaults.openshellSaw.networkPolicy.extraEgress[0].ports[0].port
        value: '443'

# cluster-qpvbj preliminary acceptance with network isolation enabled.
users:
- name: nptest-a
  profiles:
  - data-science
- name: nptest-b
  profiles:
  - custom-inference
  values:
    egress:
      extraAllow:
      - integrate.api.nvidia.com
defaults:
  openshellSaw:
    credentialProxy:
      enabled: true
    source:
      registryURL: docker://image-registry.openshift-image-registry.svc:5000/openshell-agents/openshell-gateway@sha256:9ca1a452ddf329b1fdbd838d0dd130f6fb7a085dc98ec8bc2a8d0b624ab30a25
    vm:
      gpu:
        enabled: false
    webSearch:
      enabled: false
    networkPolicy:
      clusterNetworkCIDRs:
      - 10.232.0.0/14
      serviceNetworkCIDRs:
      - 172.231.0.0/16
      enabled: true
    cleanupApi:
      serviceIP: 172.231.0.1
      endpoints:
      - ip: 10.10.10.10
        port: 6443
      - ip: 10.10.10.11
        port: 6443
      - ip: 10.10.10.12
        port: 6443

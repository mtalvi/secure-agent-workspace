# One entry per person. Push this file and Argo CD creates saw-<name>.
# The chart cannot create Keycloak users or Vault entries.
# ownerSubject is the Keycloak subject from `openshell whoami`. Leave it
# empty until that person has logged in once.
users:
  - name: alice
    profiles:
      - data-science
    # LaunchPad test only. Both H100s on this node. Turn off before merging to main.
    values:
      vm:
        gpu:
          enabled: true
          count: 2
          deviceName: nvidia.com/GH100_H100L_94GB

# cluster-jmq4r clean acceptance; shipped public interceptor default.
users:
- name: nptest-a
  profiles:
  - data-science
- name: nptest-b
  profiles:
  - custom-inference
  values:
    egress:
      extraAllow:
      - integrate.api.nvidia.com
defaults:

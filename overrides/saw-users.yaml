# Fresh-cluster upgrade acceptance: pre-0.1.6 baseline, then main.
users:
- name: upgrade-u1
  profiles:
  - data-science
- name: upgrade-u2
  profiles:
  - custom-inference
- name: upgrade-u3
  profiles:
  - data-science
defaults:
  openshellSaw:
    networkPolicy:
      clusterNetworkCIDRs:
      - 10.232.0.0/14
      serviceNetworkCIDRs:
      - 172.231.0.0/16
      enabled: true
    cleanupApi:
      serviceIP: 172.231.0.1
      endpoints:
      - ip: 10.10.10.10
        port: 6443
      - ip: 10.10.10.11
        port: 6443
      - ip: 10.10.10.12
        port: 6443
    egress:
      extraAllow:
      - integrate.api.nvidia.com

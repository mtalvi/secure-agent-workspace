id: custom-inference
display_name: Custom inference endpoint
description: OpenAI-compatible inference server named by this deployment
category: inference
inference_capable: true
credentials:
- name: api_key
  description: API key of the custom inference endpoint
  env_vars:
  - CUSTOM_INFERENCE_API_KEY
  required: true
  auth_style: bearer
  header_name: authorization
discovery:
  credentials:
  - api_key
endpoints:
- host: integrate.api.nvidia.com
  port: 443
  protocol: rest
  enforcement: enforce
  access: read-write
- host: pr123-keyless-inference.openshell-agents.svc.cluster.local
  port: 8000
  protocol: rest
  enforcement: enforce
  access: read-write
binaries:
- /usr/bin/curl
- /usr/local/bin/curl
- /usr/bin/node
- /usr/bin/node-*
- /usr/local/bin/node
